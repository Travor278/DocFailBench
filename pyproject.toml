[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docfailbench"
version = "0.1.0"
description = "Failure-oriented benchmark and diagnostics for Chinese PDF/OCR/VLM document parsing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "DocFailBench contributors" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
yaml = ["PyYAML>=6.0"]
fixtures = ["reportlab>=4.0"]
smoke = ["pymupdf4llm>=0.0.17", "PyMuPDF>=1.25.0"]
docling = ["docling>=2.0.0"]

[project.scripts]
docfailbench = "docfailbench.cli:main"

[tool.setuptools.packages.find]
include = ["docfailbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
