<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-labelledby="title desc">
<title id="title">DocFailBench submission status</title>
<desc id="desc">How community parser submissions are classified.</desc>
<rect width="920" height="220" rx="18" fill="#fbfcfe"/>
<text x="42" y="46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="740" fill="#111827">Submission Labels</text>
<text x="42" y="72" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#475569">A result is listed only when target, coverage, metadata, and reproducibility are clear.</text>
<rect x="42" y="112" width="194" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="58" y="129" width="16" height="16" rx="4" fill="#16a34a"/>
<text x="84" y="142" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#111827">verified</text>
<text x="58" y="162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">maintainer reproduced or audited</text>
<rect x="258" y="112" width="194" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="274" y="129" width="16" height="16" rx="4" fill="#f59e0b"/>
<text x="300" y="142" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#111827">unverified</text>
<text x="274" y="162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">complete artifacts, pending rerun</text>
<rect x="474" y="112" width="194" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="490" y="129" width="16" height="16" rx="4" fill="#2563eb"/>
<text x="516" y="142" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#111827">staging</text>
<text x="490" y="162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">Stage7 or candidate-pool diagnostic</text>
<rect x="690" y="112" width="194" height="62" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="706" y="129" width="16" height="16" rx="4" fill="#7c3aed"/>
<text x="732" y="142" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#111827">moving API</text>
<text x="706" y="162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#475569">hosted latest alias or unpinned model</text>
</svg>